# Replace YOUR_USERNAME before publishing this file to GitHub.
# This build context fetches the source even when Hostinger downloads only this YAML.
services:
  mcp:
    build:
      context: https://github.com/YOUR_USERNAME/tailwind-plus-mcp.git#main
    restart: unless-stopped
    env_file:
      - /opt/tailwind-plus.env
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      TAILWIND_PLUS_ROOT: /library
    volumes:
      - type: bind
        source: /opt/tailwind-library
        target: /library
        read_only: true
        bind:
          create_host_path: false

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - mcp
    env_file:
      - /opt/tailwind-plus.env
    entrypoint: /bin/sh
    command:
      - -ec
      - 'exec caddy reverse-proxy --from "$$MCP_DOMAIN" --to mcp:3000'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
